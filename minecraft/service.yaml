# Minecraft speaks raw TCP, not HTTP, so there's no Ingress: K3s' ServiceLB
# binds 25565 directly on the node IP (10.10.20.100). externalTrafficPolicy
# Local keeps the real client IP (logs, bans).
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
