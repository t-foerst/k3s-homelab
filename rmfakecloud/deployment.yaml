apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmfakecloud
  namespace: rmfakecloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rmfakecloud
  template:
    metadata:
      labels:
        app: rmfakecloud
    spec:
      containers:
        - name: rmfakecloud
          image: ddvk/rmfakecloud:0.0.32
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATADIR
              value: /data
            # Address of rmfakecloud as seen from the tablet (behind Traefik,
            # newer tablet software only accepts https without a port).
            - name: STORAGE_URL
              value: https://rm.foerst.haus
            - name: RM_HTTPS_COOKIE
              value: "true"
            - name: RM_TRUST_PROXY
              value: "true"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rmfakecloud-secret
                  key: JWT_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rmfakecloud-data
