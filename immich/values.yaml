controllers:
  main:
    containers:
      main:
        image:
          tag: v3.1.0
        env:
          TZ: Europe/Berlin
          DB_HOSTNAME: immich-postgres
          DB_PORT: "5432"
          DB_DATABASE_NAME: immich
          DB_USERNAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-secret
                key: db-password

immich:
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true
  controllers:
    main:
      pod:
        annotations:
          # Only job queues, rebuilt by Immich; no need to back them up
          backup.velero.io/backup-volumes-excludes: data
  persistence:
    data:
      type: persistentVolumeClaim
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 1Gi

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: null
        cert-manager.io/cluster-issuer: letsencrypt-dns
        traefik.ingress.kubernetes.io/router.middlewares: immich-immich-headers@kubernetescrd
        traefik.ingress.kubernetes.io/service.servertransport: immich-immich-transport@kubernetescrd
      hosts:
        - host: photos.foerst.haus
          paths:
            - path: "/"
              service:
                identifier: main
      tls:
        - secretName: immich-tls
          hosts:
            - photos.foerst.haus

machine-learning:
  enabled: true
  controllers:
    main:
      pod:
        annotations:
          # Model cache, re-downloaded on demand; no need to back it up
          backup.velero.io/backup-volumes-excludes: cache
      containers:
        main:
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
  persistence:
    cache:
      type: persistentVolumeClaim
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 10Gi
