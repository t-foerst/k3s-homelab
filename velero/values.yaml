initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

credentials:
  useSecret: true
  existingSecret: velero-secret

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: k3s-backup
      config:
        region: garage # must match Garage's configured s3_region, or S3 auth fails
        s3Url: http://100.92.156.184:3900 # only reachable once the K3s host has joined the Netbird network
        s3ForcePathStyle: true
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
  uploaderType: kopia

# FS backup (Kopia) via a node-agent DaemonSet — needed because there's no CSI
# snapshotter (local-path/NFS), so this is how PVC contents actually get backed up.
deployNodeAgent: true

schedules:
  daily:
    schedule: "0 3 * * *"
    template:
      ttl: "720h" # 30 days
      excludedNamespaces:
        - kube-system
        - velero
