initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

credentials:
  useSecret: true
  existingSecret: velero-secret

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: k3s-backup
      config:
        region: garage # must match Garage's configured s3_region, or S3 auth fails
        s3Url: http://192.168.2.189:3900 # only reachable once the K3s host has joined the Netbird network 100.92.156.184
        s3ForcePathStyle: true
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
  uploaderType: kopia
  fsBackupTimeout: 24h # default is 4h, too short for a volume's first-ever (non-incremental) snapshot
  defaultItemOperationTimeout: 24h

# FS backup (Kopia) via a node-agent DaemonSet — needed because there's no CSI
# snapshotter (local-path/NFS), so this is how PVC contents actually get backed up.
deployNodeAgent: true

# Metrics are enabled by default (port 8085) but ClusterIP-only; NodePort makes
# them reachable for the external Prometheus on the LAN, same pattern as
# monitoring/traefik-metrics-service.yaml.
metrics:
  enabled: true
  service:
    type: NodePort
    nodePort: 30091

schedules:
  daily:
    schedule: "0 3 * * *"
    template:
      ttl: "720h" # 30 days
      excludedNamespaces:
        - kube-system
        - velero
