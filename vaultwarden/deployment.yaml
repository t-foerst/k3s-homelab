apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
      annotations:
        # Copying the live SQLite DB + WAL file by file isn't guaranteed to be
        # consistent. `vaultwarden backup` (VACUUM INTO) writes a consistent copy
        # right before Velero backs up /data; keep only the latest as db-backup.sqlite3.
        pre.hook.backup.velero.io/container: vaultwarden
        pre.hook.backup.velero.io/command: '["/bin/sh", "-c", "/vaultwarden backup && cd /data && mv \"$(ls -t db_*.sqlite3 | head -n1)\" db-backup.sqlite3 && rm -f db_*.sqlite3"]'
        pre.hook.backup.velero.io/timeout: 2m
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: ADMIN_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
