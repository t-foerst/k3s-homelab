apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
      annotations:
        backup.velero.io/backup-volumes-excludes: audiobooks
    spec:
      # Runs as UID 1000 like the *arr apps and Bindery: the NFS server squashes
      # root to nobody, which can't write covers/metadata.json into the book
      # folders Bindery creates (owned by 1000, mode 750).
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # The config volume was written by root before; hand it over to 1000.
        - name: chown-config
          image: busybox:1.37
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["sh", "-c", "chown -R 1000:1000 /config && chmod -R u+rwX /config"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 13378
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "13378"
            - name: CONFIG_PATH
              value: "/config"
            # Lives inside the config volume; covers and metadata.json are
            # stored next to each book, so this only holds cache, logs and
            # ABS backups.
            - name: METADATA_PATH
              value: "/config/metadata"
            # Overrides the backup path stored in the DB (still the old
            # /metadata/backups from when the metadata had its own volume).
            - name: BACKUP_PATH
              value: "/config/metadata/backups"
            - name: AUDIOBOOKS_PATH
              value: "/audiobooks"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: audiobooks
              mountPath: /audiobooks
              subPath: audiobooks
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: abs-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: abs-media
