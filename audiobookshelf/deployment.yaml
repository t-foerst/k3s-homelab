apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
      annotations:
        backup.velero.io/backup-volumes-excludes: audiobooks
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 13378
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "13378"
            - name: CONFIG_PATH
              value: "/config"
            # Lives inside the config volume; covers and metadata.json are
            # stored next to each book, so this only holds cache, logs and
            # ABS backups.
            - name: METADATA_PATH
              value: "/config/metadata"
            - name: AUDIOBOOKS_PATH
              value: "/audiobooks"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: audiobooks
              mountPath: /audiobooks
              subPath: audiobooks
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: abs-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: abs-media
