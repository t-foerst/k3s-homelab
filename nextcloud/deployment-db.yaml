apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
      annotations:
        # Kopia copies the live PGDATA file by file, which isn't guaranteed to be
        # consistent. Dump the DB right before Velero backs up the volume; the dump
        # sits next to PGDATA on the same PVC, so it ends up in the backup too.
        # Uncompressed (-Z 0) so Kopia can deduplicate it between days.
        pre.hook.backup.velero.io/container: postgres
        pre.hook.backup.velero.io/command: '["/bin/sh", "-c", "pg_dump -U nextcloud -d nextcloud -Fc -Z 0 -f /var/lib/postgresql/data/nextcloud.dump.tmp && mv /var/lib/postgresql/data/nextcloud.dump.tmp /var/lib/postgresql/data/nextcloud.dump"]'
        pre.hook.backup.velero.io/timeout: 10m
    spec:
      containers:
        - name: postgres
          image: postgres:16.15
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=256MB"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: postgresql-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - nextcloud
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: nextcloud-db
