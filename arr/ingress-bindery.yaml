apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bindery
  namespace: arr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bindery.foerst.haus
      secretName: bindery-tls
  rules:
    - host: bindery.foerst.haus
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bindery
                port:
                  number: 8787
