# Bindery (Readarr replacement), used for audiobooks only. Both library dirs
# point at /media/audiobooks, the folder Audiobookshelf serves. The image is
# distroless and can't switch users, so the UID is set here instead of PUID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bindery
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bindery
  template:
    metadata:
      labels:
        app: bindery
      annotations:
        backup.velero.io/backup-volumes-excludes: tmp,media,downloads
    spec:
      # The Service "bindery" would otherwise inject BINDERY_PORT=tcp://...,
      # which Bindery reads as its listen port.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bindery
          image: ghcr.io/vavallee/bindery:1.41.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: BINDERY_PORT
              value: "8787"
            - name: BINDERY_DB_PATH
              value: /config/bindery.db
            - name: BINDERY_DATA_DIR
              value: /config
            - name: BINDERY_LIBRARY_DIR
              value: /media/audiobooks
            - name: BINDERY_AUDIOBOOK_DIR
              value: /media/audiobooks
            - name: BINDERY_DOWNLOAD_DIR
              value: /downloads
            - name: BINDERY_PUID
              value: "1000"
            - name: BINDERY_PGID
              value: "1000"
            - name: BINDERY_TELEMETRY_DISABLED
              value: "true"
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: downloads
              mountPath: /downloads
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: bindery-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-media
        - name: downloads
          persistentVolumeClaim:
            claimName: arr-downloads
